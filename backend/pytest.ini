[pytest]
# pytest config — unit-test suite for agent helpers.
#
# Run from backend/ as:
#     .venv/bin/python -m pytest -v
#
# The integration smoke test (tests/smoke.py) is NOT pytest-discovered
# — it's a stand-alone script that requires the live service. Listed
# in `norecursedirs` would be enough but we use a discovery filter
# instead so contributors who add `test_*.py` files don't have to
# remember to whitelist them.

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# pytest-asyncio: auto-detect @pytest.mark.asyncio on async tests.
# Most of our helpers are sync; this is for future async test cases.
asyncio_mode = auto
