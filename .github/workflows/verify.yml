# verify — automated checks that run on every push + PR.
#
# What this catches:
#   - Backend Python syntax / import errors + unit-test regressions (pytest).
#   - Frontend TypeScript errors (tsc -b inside `npm run build`) + Vitest.
#   - Tool-catalog codegen drift (gen-tools runs as part of build).
#
# The integration smoke test (backend/tests/smoke.py) is NOT run in CI — it
# needs a live community MCP server. Run it operator-side after deployment.

name: verify

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Run pytest
        run: |
          . .venv/bin/activate
          python -m pytest -v

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (gen-tools + tsc + vite)
        run: npm run build
      - name: Unit tests (Vitest)
        run: npm test
